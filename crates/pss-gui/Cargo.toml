[package]
name = "pss-gui"
authors = ["TounSec"]
description = "PSS-BattleStats for GUI"
version.workspace = true
edition.workspace = true

[[bin]]
name = "pss-battlestats"
path = "src/main.rs"

[dependencies]
pss-model.workspace = true
pss-designs.workspace = true
pss-store.workspace = true
pss-stats.workspace = true
pss-capture.workspace = true
pss-codec.workspace = true
tokio.workspace = true
eframe = "0.36.2"
egui = "0.36.2"
egui_extras = { version = "0.36.2", features = ["http", "image"] }
rfd = "0.17"
anyhow.workspace = true
reqwest.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
rust-i18n = "4.2.4"
