[package]
name = "pss-capture"
version.workspace = true
edition.workspace = true

[lib]
name = "pss_capture"
path = "src/lib.rs"

[[bin]]
name = "pss-capture"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
pss-codec.workspace = true
pss-model.workspace = true
pss-store.workspace = true
serde_json.workspace = true
hudsucker = "0.25.0"
tokio = { version = "1.53.1", features = ["full"] }
http-body-util = "0.1.5"
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
