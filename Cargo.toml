[workspace]
resolver = "2"
members = [
  "crates/pss-capture",
  "crates/pss-codec",
  "crates/pss-model",
  "crates/pss-designs",
  "crates/pss-store",
  "crates/pss-stats",
  "crates/pss-cli",
  "crates/pss-gui",
]

[workspace.package]
version = "0.1.1-beta.1"
edition = "2024"

[workspace.dependencies]
pss-capture = { path = "crates/pss-capture" }
pss-codec = { path = "crates/pss-codec" }
pss-model = { path = "crates/pss-model" }
pss-designs = { path = "crates/pss-designs" }
pss-store = { path = "crates/pss-store" }
pss-stats = { path = "crates/pss-stats" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13.5", features = ["json"] }
anyhow = "1.0.104"
thiserror = "2.0.20"
tokio = { version = "1.53.2", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "signal",
  "time",
  "net",
] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

# Local release builds
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = "symbols"

# BInaries release for vcs
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
