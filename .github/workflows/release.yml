name: Release

# Pushing a version tag builds binaries for Linux/Windows/macOS (x64 + arm64) and the Windows
# MSI, then publishes everything on one GitHub Release (pre-release if the tag has a suffix).
#   git tag -a v0.1.0 -m "Release 0.1.0" && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.v.outputs.full }}
      core: ${{ steps.v.outputs.core }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - name: Check tag against Cargo.toml and derive versions
        id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' is not of the form vX.Y.Z or vX.Y.Z-suffix"; exit 1
          fi
          full="${TAG#v}"
          core="${BASH_REMATCH[1]}"   # the MSI only accepts numeric X.Y.Z
          # The tag must match the workspace version, or binaries and installer would disagree
          # about their own version (and the in-app update check would misfire).
          cargo_v=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$cargo_v" != "$full" ]; then
            echo "Tag version '$full' does not match Cargo.toml version '$cargo_v'"; exit 1
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "core=$core" >> "$GITHUB_OUTPUT"
          if [[ "$full" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  binaries:
    name: binaries (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,     os: ubuntu-latest,    target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64,   os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: windows-x64,   os: windows-latest,   target: x86_64-pc-windows-msvc }
          - { name: windows-arm64, os: windows-11-arm,   target: aarch64-pc-windows-msvc }
          - { name: macos-arm64,   os: macos-latest,     target: aarch64-apple-darwin }
          - { name: macos-x64,     os: macos-15-intel,   target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libgtk-3-dev libssl-dev
      # .cargo/config.toml links with mold on x86_64 Linux only.
      - uses: rui314/setup-mold@v1
        if: matrix.target == 'x86_64-unknown-linux-gnu'
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --profile dist --locked --target ${{ matrix.target }} -p pss-gui -p pss-cli
      - name: Package
        shell: bash
        run: |
          dir="PSS-BattleStats-${{ needs.prepare.outputs.full }}-${{ matrix.name }}"
          ext=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then ext=".exe"; fi
          mkdir "$dir"
          for bin in pss-battlestats pss-battlestats-cli; do
            cp "target/${{ matrix.target }}/dist/$bin$ext" "$dir/"
          done
          cp LICENSE "$dir/"
          if [ -n "$ext" ]; then 7z a "$dir.zip" "$dir"; else tar czf "$dir.tar.gz" "$dir"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: |
            PSS-BattleStats-*.zip
            PSS-BattleStats-*.tar.gz

  msi:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: msi
      - name: Build the GUI (dist profile)
        run: cargo build --profile dist -p pss-gui --locked
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build the MSI
        shell: pwsh
        run: |
          wix build installer/main.wxs `
            -d Version=${{ needs.prepare.outputs.core }} `
            -o PSS-BattleStats-${{ needs.prepare.outputs.full }}.msi
      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: PSS-BattleStats-*.msi

  publish:
    needs: [prepare, binaries, msi]
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create the release and upload the assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum PSS-BattleStats-* > SHA256SUMS.txt
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: true
